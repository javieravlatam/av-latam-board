<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIC-AV — Acceso</title>
<link rel="stylesheet" href="sic_styles.css">
<style>
  body { background:#F4F6F9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card {
    background:#fff; border-radius:14px; box-shadow:0 4px 24px rgba(27,79,138,.12);
    padding:42px 40px 36px; max-width:400px; width:100%;
  }
  .login-logo { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
  .login-logo-badge { background:#1B4F8A; color:#fff; font-weight:900; font-size:18px; border-radius:8px; padding:8px 12px; letter-spacing:.04em; line-height:1.1; text-align:center; }
  .login-logo-text h1 { font-size:17px; font-weight:700; color:#1b2027; margin:0; }
  .login-logo-text p { font-size:12px; color:#7a8898; margin:2px 0 0 0; }
  .login-field { margin-bottom:16px; }
  .login-field label { display:block; font-size:12px; font-weight:700; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }
  .login-field input {
    width:100%; box-sizing:border-box; padding:10px 12px;
    border:1.5px solid #d1dae5; border-radius:8px;
    font-size:15px; color:#1b2027; outline:none; transition:border-color .15s;
  }
  .login-field input:focus { border-color:#1B4F8A; }
  .login-btn {
    width:100%; padding:12px; background:#1B4F8A; color:#fff;
    border:none; border-radius:8px; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:6px; transition:background .15s;
  }
  .login-btn:hover { background:#15407a; }
  .login-error { color:#a83232; font-size:12.5px; margin-top:8px; min-height:18px; }
  .login-footer { font-size:11.5px; color:#9BA5B0; text-align:center; margin-top:22px; line-height:1.5; }
  .login-footer a { color:#1B4F8A; text-decoration:none; }

  /* Panel cambio de clave */
  .cambio-clave-panel { display:none; }
  .cambio-clave-panel.visible { display:block; }
  .login-card-title { font-size:15px; font-weight:700; color:#1b2027; margin:0 0 6px; }
  .login-card-sub { font-size:13px; color:#7a8898; margin:0 0 22px; }
  .alert-primer-ingreso {
    background:#FFF4E0; border:1px solid #B8791A; border-radius:8px;
    padding:10px 14px; font-size:12.5px; color:#7a4a00; margin-bottom:18px;
  }

  /* Selector de pais para gerencia */
  .pais-selector { display:none; margin-top:22px; }
  .pais-selector.visible { display:flex; gap:12px; }
  .pais-btn {
    flex:1; padding:13px 0; border:2px solid #1B4F8A; border-radius:8px;
    background:#fff; color:#1B4F8A; font-size:15px; font-weight:700;
    cursor:pointer; transition:all .15s;
  }
  .pais-btn:hover { background:#1B4F8A; color:#fff; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-badge">AV<br>LATAM</div>
    <div class="login-logo-text">
      <h1>Sistema Integral de Incentivos Comerciales</h1>
      <p>Grupo AV LATAM · Acceso personal</p>
    </div>
  </div>

  <!-- PANEL LOGIN -->
  <div id="panel-login">
    <div class="login-field">
      <label>Usuario</label>
      <input type="text" id="inp-usuario" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="inp-clave" placeholder="Tu contraseña" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="intentarLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>

    <!-- Para gerencia: elegir pais despues del login -->
    <div class="pais-selector" id="pais-selector">
      <button class="pais-btn" onclick="irAPais('CL')">🇨🇱 Chile</button>
      <button class="pais-btn" onclick="irAPais('PE')">🇵🇪 Perú</button>
    </div>
  </div>

  <!-- PANEL CAMBIO DE PIN (primer ingreso) -->
  <div id="panel-cambio" class="cambio-clave-panel">
    <p class="login-card-title">Bienvenido — configura tu PIN</p>
    <p class="login-card-sub">Es tu primer ingreso. Define un PIN personal de 4 dígitos.</p>
    <div class="alert-primer-ingreso">
      Tu PIN se guarda de forma <b>centralizada y segura</b>. Funcionará desde cualquier dispositivo.
    </div>
    <div class="login-field">
      <label>Nuevo PIN (4 dígitos)</label>
      <input type="password" id="inp-nueva" placeholder="4 dígitos numéricos" autocomplete="new-password" maxlength="4" inputmode="numeric">
    </div>
    <div class="login-field">
      <label>Confirmar PIN</label>
      <input type="password" id="inp-confirma" placeholder="Repite los 4 dígitos" autocomplete="new-password" maxlength="4" inputmode="numeric">
    </div>
    <button class="login-btn" onclick="guardarClave()">Guardar y continuar</button>
    <div class="login-error" id="cambio-error"></div>
  </div>

  <div class="login-footer">
    <a href="../../index.html">← Volver al Board</a>
  </div>
</div>

<script src="sic_auth.js"></script>
<script>
  var _tokenTemp = null;  // token temporal usado solo durante cambio obligatorio de PIN
  var PIN_RE = /^[0-9]{4}$/;

  function _setLoading(loading) {
    var btn = document.querySelector(".login-btn");
    if (btn) btn.disabled = loading;
  }

  function intentarLogin() {
    var usuario  = document.getElementById("inp-usuario").value.trim().toLowerCase();
    var pin      = document.getElementById("inp-clave").value;
    var errEl    = document.getElementById("login-error");
    var selector = document.getElementById("pais-selector");

    errEl.textContent = "";
    selector.classList.remove("visible");

    if (!usuario || !pin) { errEl.textContent = "Ingresa tu usuario y PIN."; return; }
    if (!PIN_RE.test(pin)) { errEl.textContent = "El PIN debe tener exactamente 4 dígitos numéricos."; return; }

    _setLoading(true);
    SICAuth.autenticar(usuario, pin)
      .then(function (resp) {
        if (resp.error) { errEl.textContent = resp.error; return; }

        if (resp.cambio_obligatorio) {
          _tokenTemp = resp.token_temp;
          document.getElementById("panel-login").style.display = "none";
          document.getElementById("panel-cambio").classList.add("visible");
          return;
        }

        // Login exitoso
        SICAuth.guardarSesion(resp);
        redirigirSegunSesion(resp);
      })
      .catch(function () { errEl.textContent = "Error de conexión. Intenta nuevamente."; })
      .finally(function () { _setLoading(false); });
  }

  function guardarClave() {
    var pinActual = document.getElementById("inp-clave").value;  // el PIN temporal (1234)
    var pinNuevo  = document.getElementById("inp-nueva").value;
    var confirma  = document.getElementById("inp-confirma").value;
    var errEl     = document.getElementById("cambio-error");
    errEl.textContent = "";

    if (!PIN_RE.test(pinNuevo))  { errEl.textContent = "El PIN debe tener exactamente 4 dígitos numéricos."; return; }
    if (pinNuevo !== confirma)   { errEl.textContent = "Los PIN no coinciden."; return; }
    if (pinNuevo === pinActual)  { errEl.textContent = "El nuevo PIN debe ser diferente al PIN temporal."; return; }
    if (!_tokenTemp)             { errEl.textContent = "Sesión expirada. Vuelve a ingresar."; window.location.href = "index.html"; return; }

    _setLoading(true);
    SICAuth.cambiarClave(_tokenTemp, pinActual, pinNuevo)
      .then(function (resp) {
        if (resp.error) { errEl.textContent = resp.error; return; }
        _tokenTemp = null;
        SICAuth.guardarSesion(resp);
        redirigirSegunSesion(resp);
      })
      .catch(function () { errEl.textContent = "Error de conexión. Intenta nuevamente."; })
      .finally(function () { _setLoading(false); });
  }

  function redirigirSegunSesion(sesion) {
    if (sesion.pais === "CL")   { window.location.href = "sic_chile.html"; return; }
    if (sesion.pais === "PE")   { window.location.href = "sic_peru.html";  return; }
    if (sesion.pais === "AMBOS") { document.getElementById("pais-selector").classList.add("visible"); return; }
    window.location.href = "index.html";
  }

  function irAPais(pais) {
    window.location.href = pais === "CL" ? "sic_chile.html" : "sic_peru.html";
  }

  // Tecla Enter
  document.getElementById("inp-clave").addEventListener("keydown", function (e) {
    if (e.key === "Enter") intentarLogin();
  });
  document.getElementById("inp-usuario").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("inp-clave").focus();
  });

  // Si ya hay sesión activa válida (misma pestaña), redirigir directo
  (function () {
    var s = SICAuth.sesionActiva();
    if (!s) return;
    if (s.pais === "AMBOS") return;  // usuario elige país
    redirigirSegunSesion(s);
  })();
</script>
</body>
</html>
